name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# go.mod replaces the spec module with a sibling checkout (see README), so
# both repositories are checked out side by side at the pinned tag.
env:
  SPEC_REF: v3.0.0-m.9

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: dc2kit
      - uses: actions/checkout@v7
        with:
          repository: docker/sandbox-kit-spec
          ref: ${{ env.SPEC_REF }}
          path: sandbox-kit-spec
      - uses: actions/setup-go@v7
        with:
          go-version-file: dc2kit/go.mod
          cache-dependency-path: dc2kit/go.sum
      - name: gofmt
        working-directory: dc2kit
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: dc2kit
        run: go vet ./...
      - name: test
        working-directory: dc2kit
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          path: dc2kit
      - uses: actions/checkout@v7
        with:
          repository: docker/sandbox-kit-spec
          ref: ${{ env.SPEC_REF }}
          path: sandbox-kit-spec
      - uses: actions/setup-go@v7
        with:
          go-version-file: dc2kit/go.mod
          cache-dependency-path: dc2kit/go.sum
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: build kits, check conformance, run in-image checks
        working-directory: dc2kit
        run: scripts/e2e.sh
